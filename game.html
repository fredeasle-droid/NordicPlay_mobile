<!DOCTYPE html>
<html lang="da" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Bonanza - NordicPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing:border-box; }
        html, body {
            margin:0;
            min-height:100%;
            background:#0b1311;
            color:#fff;
            font-family:'Inter',sans-serif;
            -webkit-tap-highlight-color:transparent;
        }
        body { padding-bottom:72px; }
        ::-webkit-scrollbar { display:none; }

        .game-shell {
            width:100%;
            max-width:480px;
            margin:0 auto;
        }

        /* Normal game size inside the NordicPlay design */
        .game-frame-wrap {
            position:relative;
            width:100%;
            height:70vh;
            max-height:700px;
            min-height:0;
            background:#000;
            border:1px solid #1f3831;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 12px 40px rgba(0,0,0,.45);
        }

        .game-frame-wrap iframe {
            width:100%;
            height:100%;
            border:0;
            display:block;
            background:#000;
        }

        .fullscreen-btn {
            position:absolute;
            top:12px;
            right:12px;
            z-index:20;
            background:rgba(0,0,0,.68);
            color:#fff;
            border:1px solid rgba(255,255,255,.28);
            border-radius:9px;
            padding:8px 11px;
            font-size:11px;
            font-weight:700;
            backdrop-filter:blur(8px);
        }

        /* CSS fullscreen fallback for iPhone/Safari */
        .game-frame-wrap.css-fullscreen {
            position:fixed;
            inset:0;
            z-index:99999;
            width:100vw;
            height:100dvh;
            max-width:none;
            max-height:none;
            min-height:0;
            border:0;
            border-radius:0;
            margin:0;
        }

        body.css-game-fullscreen {
            overflow:hidden;
            padding:0;
        }

        body.css-game-fullscreen > header,
        body.css-game-fullscreen > nav {
            display:none !important;
        }

        .game-frame-wrap:fullscreen,
        .game-frame-wrap:-webkit-full-screen {
            width:100vw;
            height:100vh;
            max-width:none;
            max-height:none;
            min-height:0;
            border:0;
            border-radius:0;
        }

        .fullscreen-btn:active { transform:scale(.97); }
    </style>
</head>
<body class="bg-[#0b1311] text-white">

    <header class="sticky top-0 z-50 bg-[#0b1311]/95 backdrop-blur-md border-b border-[#1f3831] px-3 py-2.5 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
            <button onclick="window.location.href='casino.html'" class="w-8 h-8 rounded-lg bg-[#12201c] border border-[#1f3831] flex items-center justify-center text-gray-200">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-[#00e785] to-emerald-400 flex items-center justify-center shadow-[0_0_10px_rgba(0,231,133,.4)]">
                    <i class="fa-solid fa-gamepad text-[#0b1311] text-xs font-bold"></i>
                </div>
                <div class="leading-tight">
                    <span class="font-extrabold tracking-tight text-sm">NORDIC<span class="text-[#00e785]">PLAY</span></span>
                    <div class="text-[8px] text-gray-400 tracking-wider uppercase font-semibold">Spil med omtanke</div>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-[9px] text-gray-400 bg-[#12201c] border border-[#1f3831] rounded-lg px-2 py-1.5">
                <i class="fa-solid fa-circle text-[#00e785] text-[6px] mr-1"></i> Online
            </span>
            <button onclick="window.location.href='login.html'" class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[#12201c] border border-[#1f3831] text-gray-200">Log ind</button>
        </div>
    </header>

    <main class="game-shell px-3 pt-3">
        <div class="flex items-center justify-between mb-3">
            <div>
                <div class="text-[10px] text-[#00e785] font-bold uppercase tracking-wider">Pragmatic Play</div>
                <h1 class="text-base font-extrabold">Sweet Bonanza</h1>
            </div>
            <button onclick="window.location.href='casino.html'" class="text-[10px] text-gray-400 flex items-center gap-1">
                <i class="fa-solid fa-dice"></i> Flere spil
            </button>
        </div>

        <div class="game-frame-wrap" id="gameContainer">
            <iframe
                id="gameFrame"
                src="https://demogamesfree.pragmaticplay.net/gs2c/openGame.do?lang=da&cur=DKK&gameSymbol=vs20fruitsw"
                allow="fullscreen"
                allowfullscreen="true"
                webkitallowfullscreen="true"
                mozallowfullscreen="true">
            </iframe>

            <button id="fullscreenButton" class="fullscreen-btn" onclick="toggleFullScreen()">
                <i class="fa-solid fa-expand mr-1"></i> Fuld skærm
            </button>
        </div>

        <div class="mt-3 bg-[#12201c] border border-[#1f3831] rounded-xl p-3">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-[9px] text-gray-500 uppercase tracking-wider">Spil</div>
                    <div class="text-xs font-bold">Sweet Bonanza</div>
                </div>
                <span class="text-[9px] text-[#00e785] border border-[#00e785]/30 bg-[#00e785]/10 rounded-md px-2 py-1">DEMO</span>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0b1311]/95 backdrop-blur-lg border-t border-[#1f3831] px-2 py-2 flex items-center justify-around shadow-2xl">
        <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Hjem</span>
        </a>
        <a href="casino.html" class="flex flex-col items-center gap-1 text-[#00e785]">
            <i class="fa-solid fa-dice text-base"></i>
            <span class="text-[10px] font-medium">Casino</span>
        </a>
        <a href="campaign.html" class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-gift text-base"></i>
            <span class="text-[10px] font-medium">Kampagner</span>
        </a>
        <a href="casino.html" class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
            <span class="text-[10px] font-medium">Søg</span>
        </a>
        <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-bars text-base"></i>
            <span class="text-[10px] font-medium">Menu</span>
        </a>
    </nav>

    <script>
        const container = document.getElementById('gameContainer');
        const button = document.getElementById('fullscreenButton');

        let cssFullscreen = false;

        function setButtonFullscreen(on) {
            button.innerHTML = on
                ? '<i class="fa-solid fa-compress mr-1"></i> Gå tilbage'
                : '<i class="fa-solid fa-expand mr-1"></i> Fuld skærm';
        }

        function enterCssFullscreen() {
            cssFullscreen = true;
            container.classList.add('css-fullscreen');
            document.body.classList.add('css-game-fullscreen');
            setButtonFullscreen(true);
        }

        function exitCssFullscreen() {
            cssFullscreen = false;
            container.classList.remove('css-fullscreen');
            document.body.classList.remove('css-game-fullscreen');
            setButtonFullscreen(false);
        }

        async function toggleFullScreen() {
            if (cssFullscreen || document.fullscreenElement === container || document.webkitFullscreenElement === container) {
                if (document.fullscreenElement && document.exitFullscreen) {
                    try { await document.exitFullscreen(); } catch(e) {}
                } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                    try { document.webkitExitFullscreen(); } catch(e) {}
                }
                exitCssFullscreen();
                return;
            }

            /* First try the native API. If Safari/iOS refuses it, use the
               CSS fullscreen fallback so the game still expands reliably. */
            try {
                if (container.requestFullscreen) {
                    await container.requestFullscreen();
                    setButtonFullscreen(true);
                    return;
                }
                if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                    setButtonFullscreen(true);
                    return;
                }
            } catch(e) {
                /* Native fullscreen unavailable — use CSS mode below. */
            }

            enterCssFullscreen();
        }

        document.addEventListener('fullscreenchange', () => {
            const active = document.fullscreenElement === container;
            if (!active && !cssFullscreen) setButtonFullscreen(false);
        });

        document.addEventListener('webkitfullscreenchange', () => {
            const active = document.webkitFullscreenElement === container;
            if (!active && !cssFullscreen) setButtonFullscreen(false);
        });

        setButtonFullscreen(false);
    </script>
</body>
</html>
