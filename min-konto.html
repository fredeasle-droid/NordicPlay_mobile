<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min konto - NordicPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07100d;color:#fff}
body{display:flex;min-height:100vh}
.sidebar {
    width: 240px;
    background-color: #0b1010;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
}

.avatar {
    width: 40px;
    height: 40px;
    background: #142828;
    color: #00ffcc;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
}

.user-info .name {
    display: block;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
}

.user-info .member-since {
    display: block;
    color: #8a9999;
    font-size: 11px;
}

.menu-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    color: #a0b3b3;
    text-decoration: none;
    font-size: 14px;
    border-radius: 10px;
    transition: all 0.2s ease;
}

.menu-item:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.05);
}

.menu-item.active {
    color: #000000;
    background: #00ffcc;
    font-weight: 600;
}
.content{margin-left:240px;min-height:100vh;padding:34px;min-width:0}
.content-card{max-width:900px;background:#0b1713;border:1px solid #1b342c;border-radius:18px;padding:28px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#00e785;font-weight:800}
h1{margin:6px 0 8px;font-size:28px}
.subtitle{margin:0;color:#84958f;font-size:13px}
@media(max-width:700px){
 body{display:block}
 .sidebar{position:relative;left:auto;top:auto;bottom:auto;width:100%;min-height:auto;border-right:0;border-bottom:1px solid #1b342c;padding:14px 12px}
 .user-profile{margin-bottom:12px}
 .menu-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
 .menu-item{min-height:42px;font-size:11px;padding:0 9px}
 .content{margin-left:0;padding:16px 12px}
 .content-card{padding:20px}
 h1{font-size:23px}
}

</style>
</head>
