<!DOCTYPE html>
<html lang="da" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NordicPlay - Casino & Bordspil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nordic: {
                            dark: '#0b1311',
                            card: '#12201c',
                            cardHover: '#182b26',
                            border: '#1f3831',
                            green: '#00e785',
                            greenHover: '#00c772',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #0b1311; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#0b1311] text-white min-h-screen pb-24 select-none">

    <header class="sticky top-0 z-50 bg-[#0b1311]/95 backdrop-blur-md border-b border-[#1f3831] px-3 py-2.5 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-[#00e785] to-emerald-400 flex items-center justify-center text-[#0b1311]">
                <i class="fa-solid fa-gamepad text-xs font-bold"></i>
            </div>
            <span class="font-extrabold text-sm">NORDIC<span class="text-[#00e785]">PLAY</span></span>
        </a>
        <div class="flex items-center gap-2">
            <button onclick="alert('Log ind')" class="px-2.5 py-1 rounded text-[11px] font-semibold bg-[#12201c] border border-[#1f3831] text-gray-200">Log ind</button>
            <button onclick="alert('Opret')" class="px-2.5 py-1 rounded text-[11px] font-bold bg-[#00e785] text-[#0b1311]">Opret</button>
        </div>
    </header>

    <div class="sticky top-[49px] z-40 bg-[#0b1311]/95 border-b border-[#1f3831] px-3 py-2.5 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-2 w-max">
            <button onclick="filterCategory('all')" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#00e785] text-[#0b1311] flex items-center gap-1.5 shadow-[0_0_10px_rgba(0,231,133,0.3)]">
                <i class="fa-solid fa-fire"></i> Alle Spil
            </button>
            <button onclick="filterCategory('live')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#12201c] border border-[#1f3831] text-gray-300 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-video text-cyan-400"></i> Live Casino
            </button>
            <button onclick="filterCategory('roulette')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#12201c] border border-[#1f3831] text-gray-300 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-circle-dot text-yellow-400"></i> Roulette
            </button>
            <button onclick="filterCategory('blackjack')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#12201c] border border-[#1f3831] text-gray-300 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-clone text-emerald-400"></i> Blackjack
            </button>
            <button onclick="filterCategory('poker')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#12201c] border border-[#1f3831] text-gray-300 hover:text-white flex items-center gap-1.5">
                <i class="fa-solid fa-dice text-purple-400"></i> Bordspil
            </button>
        </div>
    </div>

    <main class="px-4 pt-4">
        <div class="relative rounded-2xl overflow-hidden bg-gradient-to-br from-[#12201c] via-[#0f2d24] to-[#071713] border border-[#1f3831] p-5 shadow-xl mb-4">
            <div class="relative z-10 flex flex-col gap-2">
                <div class="inline-flex items-center gap-2 bg-black/40 px-2.5 py-1 rounded-full border border-white/10 w-fit text-[11px] text-cyan-400 font-medium">
                    <i class="fa-solid fa-dice"></i> Casino & Live Dealer
                </div>
                <h1 class="text-xl font-black uppercase tracking-tight text-white">
                    Eksklusivt <span class="text-[#00e785]">Casino</span>
                </h1>
                <p class="text-xs text-gray-300">Vælg en kategori ovenfor eller udforsk spillene herunder.</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div onclick="alert('Starter Lightning Roulette')" class="bg-[#12201c] border border-[#1f3831] rounded-xl overflow-hidden cursor-pointer hover:border-[#00e785] transition">
                <div class="relative aspect-[4/3] bg-gray-800"><img src="https://placehold.co/280x210/182b26/00e785?text=Roulette" class="w-full h-full object-cover"></div>
                <div class="p-2.5"><h3 class="font-bold text-xs text-white">Lightning Roulette</h3><p class="text-[10px] text-cyan-400">Live Dealer • Roulette</p></div>
            </div>
            <div onclick="alert('Starter Infinite Blackjack')" class="bg-[#12201c] border border-[#1f3831] rounded-xl overflow-hidden cursor-pointer hover:border-[#00e785] transition">
                <div class="relative aspect-[4/3] bg-gray-800"><img src="https://placehold.co/280x210/182b26/00e785?text=Blackjack" class="w-full h-full object-cover"></div>
                <div class="p-2.5"><h3 class="font-bold text-xs text-white">Infinite Blackjack</h3><p class="text-[10px] text-emerald-400">Live Dealer • Blackjack</p></div>
            </div>
            <div onclick="alert('Starter Immersive Roulette')" class="bg-[#12201c] border border-[#1f3831] rounded-xl overflow-hidden cursor-pointer hover:border-[#00e785] transition">
                <div class="relative aspect-[4/3] bg-gray-800"><img src="https://placehold.co/280x210/182b26/00e785?text=Immersive+Roulette" class="w-full h-full object-cover"></div>
                <div class="p-2.5"><h3 class="font-bold text-xs text-white">Immersive Roulette</h3><p class="text-[10px] text-yellow-400">Roulette</p></div>
            </div>
            <div onclick="alert('Starter Casino Holdem')" class="bg-[#12201c] border border-[#1f3831] rounded-xl overflow-hidden cursor-pointer hover:border-[#00e785] transition">
                <div class="relative aspect-[4/3] bg-gray-800"><img src="https://placehold.co/280x210/182b26/00e785?text=Casino+Holdem" class="w-full h-full object-cover"></div>
                <div class="p-2.5"><h3 class="font-bold text-xs text-white">Casino Hold'em</h3><p class="text-[10px] text-purple-400">Bordspil</p></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0b1311]/95 backdrop-blur-lg border-t border-[#1f3831] px-2 py-2 flex items-center justify-around">
        <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px]">Hjem</span>
        </a>
        <a href="casino.html" class="flex flex-col items-center gap-1 text-[#00e785]">
            <i class="fa-solid fa-dice text-base"></i>
            <span class="text-[10px]">Casino</span>
        </a>
        <a href="slots.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-fire text-base"></i>
            <span class="text-[10px]">Slots</span>
        </a>
    </nav>

    <script>
        function filterCategory(cat) {
            alert('Filter valgt: ' + cat);
        }
    </script>
</body>
</html>
