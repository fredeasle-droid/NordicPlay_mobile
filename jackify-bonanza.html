<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Jackify Bonanza · NordicPlay</title>
<meta name="theme-color" content="#13051f">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#ff72c9;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow-x:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{min-height:100vh;position:relative;overflow:hidden;background:
radial-gradient(circle at 15% 18%,#fff7 0 2%,transparent 2.5%),
radial-gradient(circle at 84% 22%,#fff8 0 1.5%,transparent 2%),
linear-gradient(180deg,#9b57ef 0%,#ee63d0 38%,#ff9a68 72%,#ffcf64 100%)}
.app:before{content:"";position:absolute;inset:0;background:
radial-gradient(ellipse at 8% 20%,#ffb2df 0 7%,transparent 7.5%),
radial-gradient(ellipse at 92% 28%,#80dcff 0 8%,transparent 8.5%),
radial-gradient(ellipse at 12% 78%,#70eaff 0 7%,transparent 7.5%),
radial-gradient(ellipse at 86% 76%,#ffed7b 0 8%,transparent 8.5%);
opacity:.7;pointer-events:none}
.app:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-90px;height:250px;background:radial-gradient(ellipse,#fff4 0 15%,transparent 16%),radial-gradient(ellipse at 20%,#ffd34d 0 8%,transparent 9%),radial-gradient(ellipse at 60%,#ff5fc4 0 9%,transparent 10%),radial-gradient(ellipse at 90%,#66e4ff 0 8%,transparent 9%);filter:blur(3px);opacity:.85}
.topbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:13px 15px 3px}
.circle{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#382046,#17112a);border:3px solid #ffe072;box-shadow:0 3px 0 #74213e,0 7px 18px #4e174c88;font-size:32px}
.balance{min-width:205px;padding:8px 25px;border-radius:34px;text-align:center;background:linear-gradient(#203044,#101d2d);border:1px solid #54e8d1;box-shadow:inset 0 1px #ffffff20,0 6px 18px #39114d66}
.balance small{display:block;color:#9da8b8;font-size:13px;font-weight:900}.balance strong{display:block;color:#13efb3;font-size:25px;line-height:27px}
.brand{position:relative;z-index:4;text-align:center;margin-top:-2px}
.logo{font-size:clamp(45px,14vw,86px);font-weight:1000;font-style:italic;letter-spacing:-6px;line-height:.75;text-transform:uppercase;
background:linear-gradient(#ffb4ff 0%,#ff24a9 31%,#ff6b00 60%,#ffe53a 86%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #6c116d;
filter:drop-shadow(0 5px 0 #3a075d) drop-shadow(0 0 12px #ff54d9)}
.logo span{display:block;font-size:.68em;letter-spacing:-5px;margin-top:7px;background:linear-gradient(#fff26b,#ffb900 48%,#ff4a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{display:inline-block;margin-top:14px;padding:8px 30px;border-radius:35px;border:3px solid #ffd873;background:linear-gradient(90deg,#db006e,#ff3c8e,#ffb800,#ff3c8e,#db006e);box-shadow:0 6px 0 #86144d,0 10px 20px #64124e66;font-weight:1000;font-size:clamp(17px,4.8vw,27px);text-shadow:0 3px 0 #8d154d}
.cabinet{position:relative;z-index:5;margin:17px 17px 0;padding:8px;border-radius:33px;background:linear-gradient(90deg,#ffca72,#fff2b5,#ff45bc,#fff,#ffcc4d);box-shadow:0 12px 30px #5d174d88}
.cabinet:before{content:"";position:absolute;inset:4px;border-radius:28px;background:linear-gradient(180deg,#fff1c7,#ff58c4,#fff0b8);z-index:0}
.frame{position:relative;z-index:1;padding:8px;border-radius:27px;background:linear-gradient(180deg,#7e38b0,#391c7a);border:3px solid #ffbfe8;box-shadow:inset 0 0 22px #18063b}
 .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:5px;border-radius:20px;background:linear-gradient(180deg,#7550b4,#3a217b);box-shadow:inset 0 0 28px #14032f}
.cell{aspect-ratio:1/1;display:grid;place-items:center;position:relative;border-radius:8px;background:linear-gradient(145deg,#9364cf,#56339b 55%,#39226f);border:1px solid #ffffff38;box-shadow:inset 0 2px 5px #fff3,0 2px 4px #21063f}
.cell.win{animation:win .5s ease-in-out 2;z-index:3}.cell.fall{animation:fall .32s ease-out}
@keyframes win{50%{transform:scale(1.15);filter:brightness(1.5);box-shadow:0 0 22px #fff25a,0 0 34px #ff4ec5,inset 0 0 15px #fff9}}
@keyframes fall{from{transform:translateY(-140%);opacity:0}to{transform:none;opacity:1}}
.symbol{width:78%;height:78%;filter:drop-shadow(0 4px 2px #0009);position:relative}
.heart{background:linear-gradient(145deg,#ff6175,#e40043 58%,#7f0039);clip-path:polygon(50% 96%,5% 51%,4% 28%,12% 9%,29% 5%,50% 25%,71% 5%,88% 9%,96% 28%,95% 51%);border:2px solid #ffbac4}
.green{background:linear-gradient(145deg,#8dff5e,#00d246 55%,#00843d);clip-path:polygon(50% 0,95% 25%,82% 82%,50% 100%,18% 82%,5% 25%);border:3px solid #d8ff9e}
.pink{border-radius:22%;background:linear-gradient(145deg,#ff7fff,#c316e9 55%,#65009c);border:3px solid #ffbaff}.pink:after{content:"";position:absolute;inset:20%;border:4px solid #ff94fa;border-radius:20%}
.blue{border-radius:40%;background:linear-gradient(145deg,#65edff,#087dff 55%,#1636ad);border:3px solid #c5fbff}.blue:after{content:"";position:absolute;inset:20% 15%;border:4px solid #6de3ff;border-radius:50%}
.banana{width:84%;height:45%;border-radius:50%;border:11px solid #ffd21a;border-left-color:transparent;border-top-color:#fff04a;transform:rotate(28deg)}
.melon{border-radius:50%;background:repeating-linear-gradient(70deg,#08753d 0 6px,#25d14d 7px 12px,#0c9341 13px 18px);border:3px solid #72ff9c}
.apple{border-radius:47% 47% 50% 50%;background:linear-gradient(145deg,#ff6060,#e5003e 55%,#81002e);border:3px solid #ffb0b0}.apple:after{content:"";position:absolute;width:12px;height:21px;right:22%;top:-13%;background:#61d74b;border-radius:100% 0}
.grapes{background:radial-gradient(circle at 30% 30%,#c67bff 0 10%,transparent 11%),radial-gradient(circle at 53% 25%,#9d50ff 0 12%,transparent 13%),radial-gradient(circle at 73% 38%,#7028df 0 13%,transparent 14%),radial-gradient(circle at 32% 55%,#8b2de8 0 14%,transparent 15%),radial-gradient(circle at 58% 57%,#6518c9 0 14%,transparent 15%),radial-gradient(circle at 47% 80%,#5010b2 0 15%,transparent 16%)}
.plum{border-radius:48%;background:linear-gradient(145deg,#ff83e9,#e01dc5 50%,#78178e);border:3px solid #ffc4f5}
.candy{border-radius:50%;background:repeating-linear-gradient(45deg,#fff 0 9px,#ff38aa 10px 19px);border:4px solid #ffb9e8}.candy:after{content:"";position:absolute;inset:17%;border:5px solid #ffd8f2;border-radius:50%}
.lollipop{border-radius:50%;background:repeating-radial-gradient(circle,#fff 0 7px,#ff3ab4 8px 15px);border:4px solid #fff}
.controls{position:relative;z-index:6;display:grid;grid-template-columns:1.05fr 1.35fr 1.05fr;gap:8px;align-items:center;padding:14px 17px 9px}
.panel{border-radius:23px;background:linear-gradient(180deg,#20162e,#0c0b16);border:2px solid #ffcc72;box-shadow:0 7px 18px #4d164d88;padding:9px;text-align:center;min-height:92px}
.panel label{font-size:14px;font-weight:1000}.bet{font-size:25px;font-weight:1000;margin:3px}.plusminus{display:flex;justify-content:space-between}.smallbtn{width:38px;height:38px;border-radius:50%;background:#171726;border:2px solid #ffbe63;font-size:25px}
.spin{width:min(150px,31vw);height:min(150px,31vw);margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ff74df,#ef159e 52%,#8d087d);border:6px solid #ffd66e;box-shadow:0 0 0 5px #ff6bd044,0 0 35px #ff27c099,0 10px 22px #0009;font-size:clamp(50px,14vw,80px);font-weight:1000}
.spin:active{transform:scale(.94)}.spin:disabled{opacity:.5}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.quick button{min-height:68px;border-radius:18px;background:linear-gradient(#1c1b2c,#10101b);border:1px solid #ffc55f;font-size:10px;font-weight:1000}.quick b{display:block;color:#ffe36c;font-size:22px;margin-bottom:2px}
.buy{position:relative;z-index:6;margin:3px 17px 22px;padding:13px 12px 15px;text-align:center;border-radius:27px;background:linear-gradient(180deg,#ff2b9f,#9d087f);border:3px solid #ffd96b;box-shadow:0 9px 25px #56134588}.buy h2{margin:0;color:#fff;text-shadow:0 3px 0 #7b0055;font-size:27px}.buy p{margin:0 0 8px;font-weight:1000;font-size:17px}.buy button{width:min(430px,100%);padding:12px;border-radius:18px;background:linear-gradient(#fff15a,#ffb600);color:#652100;font-size:27px;font-weight:1000;box-shadow:inset 0 2px #fff,0 5px #a94d00}
.status{position:relative;z-index:6;min-height:23px;text-align:center;padding:0 12px 5px;font-size:13px;font-weight:1000;color:#fff7a5}
.toast{position:fixed;z-index:50;left:50%;top:48%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;padding:18px 28px;border-radius:25px;background:linear-gradient(#ff42b8,#9c0b84);border:3px solid #ffe36b;box-shadow:0 0 45px #ff3cc5;text-align:center;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast strong{display:block;font-size:38px}.toast span{font-weight:1000;color:#fff3a0}
.modal{position:fixed;inset:0;z-index:60;background:#12031ddd;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(420px,100%);padding:20px;border-radius:27px;background:#21102e;border:2px solid #ffd269}.dialog h2{margin:0 0 12px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opts button{padding:13px;border-radius:14px;background:#171224;border:1px solid #9d63c4;font-weight:900}.opts button.selected{background:linear-gradient(90deg,#ff1da5,#9135ff);border-color:#ffe269}.check{display:flex;gap:8px;margin:12px 0;font-size:13px;font-weight:700}.primary,.close{width:100%;padding:13px;border-radius:15px;font-weight:1000}.primary{background:linear-gradient(#fff04f,#ffaf00);color:#5f1c00;font-size:17px}.close{margin-top:8px;background:#17111f;border:1px solid #6c5874}
@media(max-width:480px){.topbar{padding-left:9px;padding-right:9px}.circle{width:48px;height:48px}.balance{min-width:156px;padding:7px 13px}.balance strong{font-size:21px}.cabinet{margin-left:7px;margin-right:7px}.controls{padding-left:7px;padding-right:7px}.panel{padding:7px}.buy{margin-left:7px;margin-right:7px}.buy h2{font-size:23px}.buy button{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <button class="circle" onclick="location.href='casino.html'" aria-label="Home">⌂</button>
 <div class="balance"><small>DEMO BALANCE</small><strong id="balance">100.00 kr</strong></div>
 <button class="circle" onclick="openAuto()" aria-label="Menu">☰</button>
</header>

<section class="brand">
 <div class="logo">JACKIFY<span>BONANZA</span></div>
 <div class="tagline">WIN UP TO 5,000× BET</div>
</section>

<main class="cabinet">
 <div class="frame">
  <div id="grid" class="grid"></div>
 </div>
</main>

<section class="controls">
 <div class="panel">
  <label>BET</label><div id="bet" class="bet">1.00 kr</div>
  <div class="plusminus"><button class="smallbtn" onclick="changeBet(-.5)">−</button><button class="smallbtn" onclick="changeBet(.5)">+</button></div>
 </div>
 <button id="spin" class="spin" onclick="spin()">↻</button>
 <div class="panel">
  <div class="quick">
   <button onclick="toggleTurbo()"><b>ϟ</b>TURBO</button>
   <button onclick="quickSpin()"><b>▶▶</b>QUICK</button>
   <button onclick="openAuto()"><b>A</b>AUTO</button>
  </div>
 </div>
</section>
<div id="status" class="status">READY · TAP SPIN TO PLAY</div>

<section class="buy">
 <h2>BUY FREE SPINS</h2><p>10 SPINS · DEMO BONUS MODE</p>
 <button onclick="buyBonus()">100.00 kr</button>
</section>
</div>

<div id="toast" class="toast"><strong id="toastBig">WIN!</strong><span id="toastSmall">0.00 kr</span></div>

<div id="modal" class="modal">
 <div class="dialog">
  <h2>Auto Spin</h2>
  <div class="opts" id="autoOpts">
   <button data-n="10" onclick="pickAuto(10)">10 SPINS</button><button data-n="25" onclick="pickAuto(25)">25 SPINS</button>
   <button data-n="50" onclick="pickAuto(50)">50 SPINS</button><button data-n="100" onclick="pickAuto(100)">100 SPINS</button>
   <button data-n="999" onclick="pickAuto(999)">∞ SPINS</button>
  </div>
  <label class="check"><input id="stopWin" type="checkbox"> Stop after a big win</label>
  <label class="check"><input id="stopLoss" type="checkbox"> Stop if balance drops below bet</label>
  <label class="check"><input id="stopBonus" type="checkbox" checked> Stop when bonus triggers</label>
  <button class="primary" onclick="startAuto()">START AUTOPLAY</button>
  <button class="close" onclick="closeAuto()">CANCEL</button>
 </div>
</div>

<script>
const symbols=['heart','green','pink','blue','banana','melon','apple','grapes','plum','candy','lollipop'];
const weights=[12,12,11,11,10,10,10,9,9,4,2];
let balance=100,bet=1,grid=[],busy=false,turbo=false,autoLeft=0,autoTimer=null,selectedAuto=10,bonusMode=false,freeSpins=0;

function money(n){return n.toFixed(2)+' kr'}
function renderBalance(){document.getElementById('balance').textContent=money(balance);document.getElementById('bet').textContent=money(bet)}
function pickSymbol(){let r=Math.random()*100;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return symbols[i]}return symbols[0]}
function makeCell(type){const d=document.createElement('div');d.className='cell';const s=document.createElement('div');s.className='symbol '+type;d.appendChild(s);if(Math.random()<.045){const m=document.createElement('div');m.className='multiplier';m.textContent='x'+([2,3,5][Math.floor(Math.random()*3)]);d.appendChild(m)}return d}
function buildGrid(){grid=Array.from({length:TOTAL},()=>pickSymbol());draw()}
function draw(){const el=document.getElementById('grid');el.innerHTML='';grid.forEach((type,i)=>{const c=makeCell(type);if(i<COLS)c.classList.add('fall');el.appendChild(c)})}
function changeBet(v){if(busy)return;bet=Math.max(.5,Math.min(10,Math.round((bet+v)*2)/2));renderBalance()}
function toggleTurbo(){turbo=!turbo;document.getElementById('status').textContent=turbo?'TURBO ON · FAST CASCADES':'TURBO OFF · NORMAL SPEED'}
function quickSpin(){if(!busy)spin(true)}
function findClusters(){const seen=new Set(),clusters=[];for(let i=0;i<30;i++){if(seen.has(i))continue;const type=grid[i],stack=[i],group=[];seen.add(i);while(stack.length){const x=stack.pop();group.push(x);const row=Math.floor(x/COLS),col=x%COLS;for(const n of [x-1,x+1,x-6,x+6]){if(n<0||n>=TOTAL||seen.has(n))continue;const nr=Math.floor(n/COLS),nc=n%6;if(Math.abs(nr-row)+Math.abs(nc-col)!==1)continue;if(grid[n]===type){seen.add(n);stack.push(n)}}}if(group.length>=5)clusters.push(group)}return clusters}
function clusterValue(group){const size=group.length;return bet*(size<6?1.1:size<8?2.2:size<10?4:size<13?8:18)}
function removeAndFall(indices){const dead=new Set(indices);for(let c=0;c<COLS;c++){const keep=[];for(let r=ROWS-1;r>=0;r--){const i=r*COLS+c;if(!dead.has(i))keep.unshift(grid[i])}while(keep.length<ROWS)keep.unshift(pickSymbol());for(let r=0;r<ROWS;r++)grid[r*COLS+c]=keep[r]}}
function showToast(amount,mult=1){const t=document.getElementById('toast');document.getElementById('toastBig').textContent=mult>1?'BIG WIN!':'WIN!';document.getElementById('toastSmall').textContent=money(amount)+(mult>1?' · x'+mult:'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),turbo?650:1000)}
function pause(ms){return new Promise(r=>setTimeout(r,ms))}
async function spin(fromAuto=false){
 if(busy)return;if(!bonusMode&&balance<bet){document.getElementById('status').textContent='NOT ENOUGH BALANCE';return}
 busy=true;document.getElementById('spin').disabled=true;
 if(!bonusMode)balance=Math.round((balance-bet)*100)/100;else freeSpins--;
 renderBalance();document.getElementById('status').textContent=bonusMode?'FREE SPIN · CASCADE IN PROGRESS':'SPINNING · FINDING CLUSTERS';
 buildGrid();await pause(turbo?120:380);
 let total=0,cascade=0,hit=false;
 while(cascade<6){
  const clusters=findClusters();if(!clusters.length)break;hit=true;cascade++;
  const indices=clusters.flat();const cells=[...document.querySelectorAll('.cell')];indices.forEach(i=>cells[i]?.classList.add('win'));
  let raw=clusters.reduce((a,g)=>a+clusterValue(g),0);let mult=cascade>3?3:cascade>1?2:1;
  if(Math.random()<.08)mult=5;const win=Math.round(raw*mult*100)/100;total+=win;
  document.getElementById('status').textContent='CASCADE '+cascade+' · +'+money(win)+(mult>1?' · MULTIPLIER x'+mult:'');
  await pause(turbo?180:520);removeAndFall(indices);draw();await pause(turbo?120:330);
 }
 if(!hit)document.getElementById('status').textContent=bonusMode?'FREE SPIN · NO WIN':'NO WIN · TRY AGAIN';
 if(total>0){balance=Math.round((balance+total)*100)/100;showToast(total,total>=bet*8?5:1)}
 if(bonusMode&&freeSpins<=0){bonusMode=false;document.getElementById('status').textContent='BONUS COMPLETE · '+money(total)+' WON';}
 renderBalance();busy=false;document.getElementById('spin').disabled=false;
 if(autoLeft>0){autoLeft--;if((document.getElementById('stopWin').checked&&total>=bet*10)||(document.getElementById('stopLoss').checked&&balance<bet)||(document.getElementById('stopBonus').checked&&bonusMode)){autoLeft=0}if(autoLeft>0)autoTimer=setTimeout(()=>spin(true),turbo?180:700)}
}
function buyBonus(){if(busy)return;const cost=100;if(balance<cost){document.getElementById('status').textContent='NEED 100.00 kr FOR BONUS BUY';return}balance-=cost;freeSpins=10;bonusMode=true;renderBalance();document.getElementById('status').textContent='BONUS ACTIVATED · 10 FREE SPINS';showToast(0,1)}
function openAuto(){if(busy)return;document.getElementById('modal').classList.add('open');pickAuto(selectedAuto)}
function closeAuto(){document.getElementById('modal').classList.remove('open')}
function pickAuto(n){selectedAuto=n;document.querySelectorAll('#autoOpts button').forEach(b=>b.classList.toggle('selected',Number(b.dataset.n)===n))}
function startAuto(){closeAuto();autoLeft=selectedAuto;spin(true)}
buildGrid();renderBalance();
</script>
</body>
</html>
